<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendar Aula - Professor</title>
  <link rel="icon" type="image/png" href="../assets/icon/icone.png">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="center">

  <div class="card">
    <div class="topbar">
      <h1>Agendar Aula</h1>
      <button type="button" class="secondary" id="btn-logout">Sair</button>
    </div>

    <form id="form-agendamento">
      <div class="form-group">
        <label for="professor">Nome do Professor</label>
        <input type="text" id="professor" placeholder="Ex: Carlos Silva" required>
      </div>

      <div class="form-group">
        <label for="materia">Matéria / Disciplina</label>
        <input type="text" id="materia" placeholder="Ex: Engenharia de Software" required>
      </div>

      <div class="form-group">
        <label for="data">Data (segunda a sexta)</label>
        <input type="date" id="data" required>
      </div>

      <div class="form-group">
        <label for="aula">Aula</label>
        <select id="aula" required>
          <option value="">Selecione...</option>
          <option value="1">1ª aula (08:00 - 08:45)</option>
          <option value="2">2ª aula (08:45 - 09:30)</option>
          <option value="3">3ª aula (09:30 - 10:15)</option>
          <option value="4">4ª aula (10:30 - 11:15)</option>
          <option value="5">5ª aula (11:15 - 12:00)</option>
          <option value="6">6ª aula (12:00 - 12:45)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="descricao_aula">Descrição da aula</label>
        <textarea id="descricao_aula" placeholder="O que será feito na aula" rows="3"></textarea>
      </div>

      <p class="erro" id="erro-agendamento"></p>

      <button type="submit" id="btn-submit">Confirmar Agendamento</button>
    </form>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/horarios.js"></script>
  <script src="../js/professor.js"></script>
</body>
</html>
