<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistema de Agendamento</title>
  <link rel="icon" type="image/png" href="assets/icon/icone.png">
  <!-- SDK Oficial do Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="center">

  <div class="card">
    <img src="assets/img/LOGO.jpg" alt="Escudo da escola" class="logo-escola">
    <h2>Laboratório - Acesso</h2>

    <div id="escolha-papel" class="escolha-papel">
      <button type="button" id="btn-escolha-professor">Sou Professor</button>
      <button type="button" id="btn-escolha-admin" class="secondary">Sou Administrador</button>
    </div>

    <form id="form-login" class="escondido">
      <div class="form-group">
        <label for="username">Usuário</label>
        <input type="text" id="username" placeholder="Usuário" autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <div class="campo-senha">
          <input type="password" id="password" placeholder="Senha" autocomplete="current-password">
          <button type="button" id="btn-mostrar-senha" class="btn-olho" aria-label="Mostrar senha">👁</button>
        </div>
      </div>

      <p class="erro" id="erro-login"></p>

      <button type="submit" id="btn-login">Entrar</button>
      <button type="button" id="btn-voltar" class="secondary">Voltar</button>
    </form>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
